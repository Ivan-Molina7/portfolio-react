<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galería de proyectos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #010403; --tx: #f2f5f3; --gold: #d6a73c; --green: #0a6b36; --hud-x: 28px; --hud-y: 22px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--tx); font-family: 'Lato', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  .scrim { position: fixed; left: 0; right: 0; z-index: 1; pointer-events: none; }
  .scrim.t { top: 0; height: 120px; background: linear-gradient(to bottom, rgba(1,4,3,.62), rgba(1,4,3,0)); }
  .scrim.b { bottom: 0; height: 110px; background: linear-gradient(to top, rgba(1,4,3,.62), rgba(1,4,3,0)); }

  /* ---------- HUD ---------- */
  .hdr { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: var(--hud-y) var(--hud-x); }
  .hdr .mark { display: block; height: 42px; width: auto; cursor: pointer; }
  .hnav { display: flex; gap: 38px; font-family: 'Lora', serif; font-size: .96rem; letter-spacing: .12em; text-transform: uppercase; }
  .hnav span { position: relative; padding: 8px 0; cursor: pointer; color: rgba(242,245,243,.72); transition: color .5s cubic-bezier(.22,1,.36,1); }
  .hnav span::after, .hudr span::after { content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 1px; background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .6s cubic-bezier(.22,1,.36,1); }
  .hnav span:hover, .hnav span.on, .hudr span:hover, .hudr span.on { color: #fff; }
  .hnav span:hover::after, .hnav span.on::after, .hudr span:hover::after, .hudr span.on::after { transform: scaleX(1); }
  .hcta { justify-self: end; }
  .btn { display: inline-block; padding: 11px 20px; border: 1px solid rgba(255,255,255,.75); background: transparent; color: #fff; font: 700 .72rem/1 'Lato', sans-serif; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; transition: background-color .5s, border-color .5s; }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn.solid { background: var(--green); border-color: var(--green); }
  .btn.solid:hover { background: #0d8a45; border-color: #0d8a45; }
  .hudl, .hudr { position: fixed; bottom: var(--hud-y); z-index: 5; height: 34px; display: flex; align-items: center; }
  .hudl { left: var(--hud-x); gap: 10px; }
  .hudl span { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.32); cursor: pointer; transition: border-color .6s cubic-bezier(.22,1,.36,1), background-color .6s cubic-bezier(.22,1,.36,1); }
  .hudl span:hover { border-color: var(--gold); background: rgba(10,107,54,.35); }
  .hudl img { display: block; width: 19px; height: 19px; object-fit: contain; opacity: .8; transition: opacity .5s; }
  .hudl span:hover img { opacity: 1; }
  .hudr { right: var(--hud-x); gap: 16px; font-family: 'Lora', serif; font-size: .88rem; letter-spacing: .16em; text-transform: uppercase; }
  .hudr span { position: relative; padding: 6px 0; cursor: pointer; color: rgba(242,245,243,.5); transition: color .5s; }
  .hudr i { display: block; width: 1px; height: 12px; background: rgba(255,255,255,.3); }
  .dots { position: fixed; right: var(--hud-x); top: 50%; transform: translateY(-50%); z-index: 5; display: flex; flex-direction: column; gap: 18px; }
  .dots svg { display: block; width: 26px; height: 26px; cursor: pointer; }
  .dots path { fill: none; stroke: rgba(242,245,243,.5); stroke-width: 1; transition: stroke .5s, fill .5s; }
  .dots svg:hover path { stroke: #fff; }
  .dots svg.on path { fill: var(--gold); stroke: var(--gold); }

  /* ---------- contenido ---------- */
  main { position: relative; z-index: 2; width: min(1200px, calc(100% - 64px)); margin: 0 auto; padding: 150px 0 190px; }
  .back { display: inline-flex; align-items: center; gap: 12px; padding: 6px 0; font-size: .74rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: rgba(242,245,243,.72); cursor: pointer; transition: color .5s; }
  .back::before { content: ""; width: 18px; height: 1px; background: var(--gold); transition: width .6s cubic-bezier(.22,1,.36,1); }
  .back:hover { color: #fff; } .back:hover::before { width: 40px; }
  h1.big { margin: 26px 0 0; font-family: 'Lora', serif; font-weight: 500; font-size: clamp(3.2rem, 7.2vw, 6.4rem); line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
  .sub { margin: 22px 0 0; max-width: 46ch; font-size: 1.05rem; line-height: 1.7; color: rgba(242,245,243,.78); }
  .bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-top: 64px; padding-bottom: 16px; position: relative; }
  .bar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, var(--gold), rgba(214,167,60,0) 85%); transform-origin: left; }
  .tabs { display: flex; gap: 36px; flex-wrap: wrap; }
  .ft { position: relative; padding: 8px 0; border: 0; background: none; cursor: pointer; font: 400 .95rem/1 'Lora', serif; letter-spacing: .16em; text-transform: uppercase; color: rgba(242,245,243,.55); transition: color .5s; }
  .ft sup { margin-left: 4px; font: 700 .6rem/1 'Lato', sans-serif; letter-spacing: .08em; vertical-align: top; color: rgba(242,245,243,.45); }
  .ft::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 1px; background: #fff; transform: scaleX(0); transform-origin: left; transition: transform .6s cubic-bezier(.22,1,.36,1); }
  .ft:hover { color: rgba(242,245,243,.9); }
  .ft.on { color: #fff; } .ft.on::after { transform: scaleX(1); }
  .cnt { font-size: .72rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: rgba(242,245,243,.5); padding-bottom: 8px; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; margin-top: 40px; }
  .card { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 276px; padding: 16px 14px 22px; border-radius: 4px; background: rgba(255,255,255,.045); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); cursor: pointer; outline: none; transition: background-color .6s cubic-bezier(.22,1,.36,1); }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); transform: scaleY(0); transform-origin: top; transition: transform .7s cubic-bezier(.22,1,.36,1); }
  .card:hover, .card:focus-visible { background: rgba(255,255,255,.075); }
  .card:hover::before, .card:focus-visible::before { transform: scaleY(1); }
  .tag { align-self: flex-start; font-size: .6rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: rgba(242,245,243,.55); }
  .logo { flex: 1; display: grid; place-items: center; width: 100%; }
  .logo img { display: block; max-width: 150px; max-height: 76px; width: auto; height: auto; opacity: .88; transition: opacity .6s; }
  .card:hover .logo img { opacity: 1; }
  .logo .mono { font-family: 'Lora', serif; font-size: 2.2rem; letter-spacing: .08em; color: rgba(242,245,243,.9); }
  .nm { margin-bottom: 14px; font-size: .64rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; text-align: center; color: rgba(242,245,243,.5); transition: color .6s; }
  .card:hover .nm { color: rgba(242,245,243,.9); }
  .btn-x { padding: 9px 16px; border: 1px solid rgba(255,255,255,.75); font-size: .64rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #fff; transition: background-color .5s; }
  .card:hover .btn-x { background: rgba(255,255,255,.12); }
  .empty { grid-column: 1 / -1; padding: 48px 0; color: rgba(242,245,243,.6); }

  /* ---------- destacado ---------- */
  .card { background: linear-gradient(rgba(255,255,255,.028), rgba(255,255,255,.028)), rgba(1,4,3,.68); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .card:hover, .card:focus-visible { background: linear-gradient(rgba(255,255,255,.06), rgba(255,255,255,.06)), rgba(1,4,3,.68); }
  .grid { position: relative; }
  .grid::before { content: ""; position: absolute; inset: -70px -90px; z-index: -1; pointer-events: none; background: radial-gradient(closest-side, rgba(1,4,3,.3), rgba(1,4,3,0)); }
  .card.dest { background: linear-gradient(180deg, rgba(10,107,54,.34), rgba(10,107,54,.10) 75%), rgba(1,4,3,.68); }
  .card.dest:hover, .card.dest:focus-visible { background: linear-gradient(180deg, rgba(10,107,54,.44), rgba(10,107,54,.16) 75%), rgba(1,4,3,.68); }
  .card.dest .tag { display: inline-flex; align-items: center; gap: 7px; color: var(--gold); }
  .card.dest .tag::before { content: ""; width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
  .card.dest .logo img { opacity: 1; }
  .card.dest .nm { color: rgba(242,245,243,.8); }

  /* ---------- entrada (mismo ritmo que el resto del sitio) ---------- */
  @keyframes revealX { from { clip-path: inset(0 100% 0 0); transform: translateX(-12px); } to { clip-path: inset(0 0 0 0); transform: none; } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(26px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes lineIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .back { animation: riseIn .8s cubic-bezier(.4,0,.2,1) .1s both; }
  h1.big { animation: revealX 1.68s cubic-bezier(.45,0,.25,1) .2s both; }
  .sub { animation: riseIn .8s cubic-bezier(.4,0,.2,1) .7s both; }
  .bar { animation: riseIn .8s cubic-bezier(.4,0,.2,1) .9s both; }
  .bar::after { animation: lineIn 1.1s cubic-bezier(.45,0,.25,1) 1.0s both; }
  .card { animation: cardIn .92s cubic-bezier(.4,0,.2,1) calc(1.1s + var(--i) * .07s) both; }
  .grid.again .card { animation-delay: calc(var(--i) * .06s); }
  .grid.out .card { opacity: 0; transform: translateY(-8px); transition: opacity .22s ease, transform .22s ease; animation: none; }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 720px) { .grid { grid-template-columns: repeat(2, 1fr); } .hnav { display: none; } .dots { display: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<script type="x-shader/x-fragment" id="fs">
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform vec2 u_mouse;
uniform float u_k;
uniform float u_fan;
uniform float u_calm;

float hash(float n) { return fract(sin(n * 127.1) * 43758.5453); }
float hash2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float lineInt(float id, float k, float t0) {
  return mix(0.25, 1.0, hash(id)) * (0.8 + 0.2 * sin(k + id * 3.1 + t0 * 0.1)) * (1.0 + 0.25 * sin(id * 5.3 + u_time * 1.5));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y - u_mouse;
  float px = 1.0 / u_res.y;
  float T = u_fan;
  vec2 q = uv;
  float refl = 1.0;
  // columnata de Proyectos: columnas de 480 px, la iluminada centrada, con hueco entre columnas
  float period = 480.0 * u_k;
  float P0x = (-231.0 - 960.0) * u_k;
  float N = 20.16;
  float gap = 0.18;
  float cxp = (q.x - P0x) / period;
  float ci = floor(cxp);
  float cf = fract(cxp);
  float dcol = ci - 2.0;
  float envc = exp(-(dcol / 3.1) * (dcol / 3.1));
  float inside = smoothstep(gap * 0.5, gap * 0.5 + 0.02, cf) * (1.0 - smoothstep(1.0 - gap * 0.5 - 0.02, 1.0 - gap * 0.5, cf));
  float xf = clamp((cf - gap * 0.5) / (1.0 - gap), 0.0, 1.0);
  float x = xf * N;
  float id = floor(x) + ci * 53.0;
  float cellpx = u_res.y * period * (1.0 - gap) / N;
  float fx = fract(x);
  float dpx = min(fx, 1.0 - fx) * cellpx;
  float line = mix(0.45, 1.0 - smoothstep(T - 0.6, T + 0.6, dpx), smoothstep(2.0, 5.0, cellpx));
  float li = lineInt(id, q.y * 6.0, u_time * 1.57);
  float shade = 0.25 + 0.75 * smoothstep(0.0, 1.0, xf);
  float v = mix(0.40, 0.95, smoothstep(-0.5, 0.5, -q.y));
  float hl = exp(-(1.0 - xf) * period * (1.0 - gap) / (px * 2.5 * T));
  float ox = envc * line * li * shade * inside * v * refl;
  float oy = (envc * 0.45 * 0.15 * shade + 0.45 * hl * envc + 0.044 * envc) * inside * v * refl;
  float I = (ox + oy) * u_calm;

  vec3 c0 = vec3(0.004, 0.018, 0.014), c1 = vec3(0.03, 0.24, 0.15), c2 = vec3(0.88, 0.64, 0.22), c3 = vec3(1.0, 0.92, 0.68);
  float sh = 0.5 + 0.5 * sin(uv.x * 2.6 - uv.y * 2.1 + u_time * 0.25 + I * 1.6);
  sh = sh * sh * (3.0 - 2.0 * sh);
  vec3 hi = mix(c2 * 0.72, c2 * 1.15, sh);
  vec3 pale = mix(c3 * 0.88, vec3(1.0), sh * 0.55);
  vec3 col = mix(c0, c1, smoothstep(0.02, 0.45, I));
  col = mix(col, hi, smoothstep(0.35, 0.90, I));
  col = mix(col, pale, smoothstep(0.85, 1.45, I));
  col *= 1.0 - 0.30 * smoothstep(0.35, 1.2, length(uv));
  float g = hash2(floor(gl_FragCoord.xy / 1.6) + 17.0);
  col = max(col + (g - 0.5) * 0.03 * (0.55 + 2.7 * max(col.g, col.r)), 0.0);
  gl_FragColor = vec4(col, 1.0);
}
</script>

  tabs.innerHTML = FILTERS.map(function (f) { return '<button type="button" class="ft' + (f[0] === current ? ' on' : '') + '" data-f="' + f[0] + '">' + f[1] + '<sup>' + count(f[0]) + '</sup></button>'; }).join('');
  function card(p, i) {
    return '<article class="card' + (p.tag === 'Destacado' ? ' dest' : '') + '" style="--i:' + i + '" tabindex="0" aria-label="' + p.n + '"><span class="tag">' + (p.tag || '&nbsp;') + '</span>' +
      '<div class="logo">' + (LG[p.k] ? '<img alt="' + p.n + '" src="' + LG[p.k] + '">' : '<span class="mono">' + p.m + '</span>') + '</div>' +
      '<div class="nm">' + p.n + '</div><span class="btn-x">Expandir</span></article>';
  }
  function render(again) {
    var list = PRJ.filter(function (p) { return current === 'all' || p.t === current; });
    grid.classList.toggle('again', !!again);
    grid.innerHTML = list.map(card).join('');
    cnt.textContent = list.length + (list.length === 1 ? ' proyecto' : ' proyectos');
  }
  render(false);
  tabs.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.ft') : null;
    if (!b || b.dataset.f === current) { return; }
    current = b.dataset.f;
    Array.prototype.forEach.call(tabs.children, function (o) { o.classList.toggle('on', o === b); });
    grid.classList.add('out');
    setTimeout(function () { grid.classList.remove('out'); render(true); }, 230);
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (el) {
    el.addEventListener('click', function () { Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (o) { o.classList.toggle('on', o === el); }); });
  });

  // ---------- fondo: la columnata de Proyectos, en calma ----------
  var canvas = document.getElementById('bg'), gl = canvas.getContext('webgl', { antialias: false, alpha: false });
  if (!gl) { return; }
  function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; }
  var vs = sh(gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }');
  var fs = sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent);
  if (!vs || !fs) { return; }
  var prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { return; }
  gl.useProgram(prog);
  var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var U = {}; ['u_res', 'u_time', 'u_mouse', 'u_k', 'u_fan', 'u_calm'].forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)'), mx = 0, my = 0, tx = 0, ty = 0, calm = 0.9, t0 = performance.now(), last = t0;
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.floor(window.innerWidth * dpr); canvas.height = Math.floor(window.innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  function draw(now) {
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    mx += (tx - mx) * (1 - Math.exp(-dt * 1.1)); my += (ty - my) * (1 - Math.exp(-dt * 1.1));
    var p = Math.min(1, Math.max(0, window.scrollY / 420)), target = 0.9 * (1 - 0.3 * p);
    calm += (target - calm) * (1 - Math.exp(-dt * 6));
    var dpr = canvas.width / window.innerWidth;
    gl.uniform2f(U.u_res, canvas.width, canvas.height);
    gl.uniform1f(U.u_time, (now - t0) / 1000);
    gl.uniform2f(U.u_mouse, mx, my);
    gl.uniform1f(U.u_k, dpr / canvas.height);
    gl.uniform1f(U.u_fan, 3.5 * dpr);
    gl.uniform1f(U.u_calm, calm);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function loop(now) { draw(now); requestAnimationFrame(loop); }
  window.addEventListener('resize', function () { resize(); if (reduce.matches) { draw(performance.now()); } });
  window.addEventListener('pointermove', function (e) { tx = (e.clientX / window.innerWidth - 0.5) * 0.06; ty = -(e.clientY / window.innerHeight - 0.5) * 0.06; });
  resize();
  if (reduce.matches) { draw(performance.now()); } else { requestAnimationFrame(loop); }
})();
</script>
